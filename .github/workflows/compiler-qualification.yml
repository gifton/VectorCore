name: Compiler byte inventory (unqualified)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Collect unqualified evidence, or verify a reviewed retained bundle
        type: choice
        options: [collect, verify]
        default: collect
        required: true
      candidate_commit:
        description: Full 40-character immutable candidate commit
        type: string
        required: true
      evidence_run_id:
        description: Prior collect run ID (verify only)
        type: string
      native_profile:
        description: Tracked reviewed native profile path in the workflow revision (verify only)
        type: string
      simulator_profile:
        description: Tracked reviewed simulator profile path in the workflow revision (verify only)
        type: string
      simulator_runtime:
        description: Explicit installed runtime identifier (collect only; later profile review required)
        type: string
        default: com.apple.CoreSimulator.SimRuntime.iOS-27-0


# Temporary diagnostic branch only. The input schema is retained for the existing
# workflow registration; this branch has no collect/verify qualification jobs.
permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
  QUALIFICATION_MODE: ${{ inputs.mode }}

jobs:
  inventory:
    name: Compiler identity and byte-region metadata only
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Require inventory dispatch
        run: test "$QUALIFICATION_MODE" = collect
      - name: Record toolchain identity
        run: >-
          python3 -B diagnostic/Scripts/ci/inspect_hosted_toolchain.py
          --developer-dir "$DEVELOPER_DIR" --candidate-commit "$CANDIDATE_COMMIT"
          --output "$RUNNER_TEMP/toolchain-inventory"
      - name: Record compiler byte-region metadata
        run: >-
          python3 -B diagnostic/Scripts/ci/inspect_compiler_bytes.py
          --developer-dir "$DEVELOPER_DIR" --candidate-commit "$CANDIDATE_COMMIT"
          --output "$RUNNER_TEMP/toolchain-inventory/byte-inventory.json"
      - name: Retain metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiler-byte-inventory
          path: ${{ runner.temp }}/toolchain-inventory/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Inventory cannot qualify a compiler or release
        if: always()
        run: |
          echo 'Compiler identity inventory only; vectorCoreQualification=unassessed; releaseAdmitted=false'
          exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VECTORCORE_TEST_EXTENDED: '0'
  VECTORCORE_STRICT_PERF: '0'

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test CI guards and hooks
        run: python3 -B -m unittest discover -s Scripts/ci/tests -v
      - name: Validate GitHub configuration
        run: ruby Scripts/ci/validate_github.rb

  test:
    name: Tests (Xcode ${{ matrix.xcode }}, ${{ matrix.configuration }})
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.2', '26.3']
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Record toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers
          uname -m
      - name: Check memory pool under executor saturation
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: python3 Scripts/ci/check_memory_pool.py --configuration "$CONFIGURATION"
      - name: Run all normally enabled tests
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -o pipefail
          mkdir -p test-results
          swift test -c "$CONFIGURATION" --xunit-output test-results/results.xml 2>&1 | tee test-results/output.log
      - name: Upload test summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tests-xcode-${{ matrix.xcode }}-${{ matrix.configuration }}
          path: test-results/
          retention-days: 14

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Install verified SwiftLint 0.65.1
        run: bash Scripts/ci/install_swiftlint.sh "$RUNNER_TEMP/swiftlint"
      - name: Lint
        run: '"$RUNNER_TEMP/swiftlint/swiftlint" lint --config .swiftlint.yml --reporter github-actions-logging'

  consumer:
    name: README consumer
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.2'
      - name: Build and execute the documented Quick Start
        run: python3 Scripts/ci/consumer_smoke.py

  platforms:
    name: Apple platform compilation
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Build library for simulator and Catalyst destinations
        run: |
          for platform in 'iOS Simulator' 'tvOS Simulator' 'watchOS Simulator' 'visionOS Simulator' 'macOS,variant=Mac Catalyst'; do
            xcodebuild -scheme VectorCore -configuration Release \
              -destination "generic/platform=$platform" \
              -derivedDataPath "$RUNNER_TEMP/platform-builds/$platform" \
              CODE_SIGNING_ALLOWED=NO build -quiet
          done
      - name: Compile library and tests for Intel macOS
        run: |
          swift build --build-tests --triple x86_64-apple-macosx14.0 \
            --scratch-path "$RUNNER_TEMP/intel-test-build"

  perf-smoke:
    name: Perf Smoke (artifact only)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Release benchmark smoke
        run: |
          swift run -c release vectorcore-bench \
            --suites dot,distance,normalize --dims 512 --min-time 0.05 \
            --samples 3 --run-seed 1 --format json --out .bench/pr_smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pr-bench-${{ github.sha }}
          path: .bench/
          include-hidden-files: true
          retention-days: 14

  required:
    name: CI Required
    if: always()
    needs: [test, lint, repository-checks, consumer, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject unsuccessful or absent required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 Scripts/ci/check_required.py test lint repository-checks consumer platforms

name: Sanitizers

# The required `sanitizers` job in ci.yml runs the same driver on every push and pull request; this standalone
# workflow is for manual runs and a weekly sweep (PR #56 review CI6: two identical 30-minute macOS jobs per PR).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VECTORCORE_TEST_EXTENDED: '0'
  VECTORCORE_STRICT_PERF: '0'

jobs:
  sanitize:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Execute pinned valid instrumented bodies
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: python3 Scripts/ci/check_sanitizers.py --sanitizer "$SANITIZER" --scratch-root "$RUNNER_TEMP/sanitizers" --output "sanitizer-results/$SANITIZER" --jobs 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sanitizer-${{ matrix.sanitizer }}
          path: sanitizer-results/
          retention-days: 14

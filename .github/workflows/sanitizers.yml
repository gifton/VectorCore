name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VECTORCORE_TEST_EXTENDED: '0'
  VECTORCORE_STRICT_PERF: '0'

jobs:
  sanitize:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Execute pinned valid instrumented bodies
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: python3 Scripts/ci/check_sanitizers.py --sanitizer "$SANITIZER" --scratch-root "$RUNNER_TEMP/sanitizers" --output "sanitizer-results/$SANITIZER" --jobs 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sanitizer-${{ matrix.sanitizer }}
          path: sanitizer-results/
          retention-days: 14

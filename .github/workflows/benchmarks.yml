name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tests:
    name: Release Build and Benchmarks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Record environment
        run: |
          swift --version
          xcodebuild -version
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.memsize
      - name: Release benchmarks
        run: swift run -c release vectorcore-bench --profile full --samples 5 --run-seed 1 --format json --out .bench/results.json
      - name: Release tests including extended cases
        env:
          VECTORCORE_TEST_EXTENDED: '1'
          VECTORCORE_STRICT_PERF: '0'
        run: swift test -c release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: .bench/
          include-hidden-files: true
          retention-days: 30
